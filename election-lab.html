<body>
<div class="app">
 <header class="topbar"><div class="brand">우리 반 모의선거 <b>LAB</b></div><div class="topright"><div class="timers" id="timers"><div>PHASE 진행 <b id="phaseTime" class="mono">00:00</b></div><div>전체 진행 <b id="totalTime" class="mono">00:00</b></div></div><button data-action="timer" id="timerToggle">타이머 숨기기</button><button data-action="fullscreen" id="fullscreen">전체 화면 ↗</button></div></header>
 <div class="progress" id="progress" aria-label="수업 진행 단계"></div>
 <main id="main"></main>
 <footer class="footer"><aside class="note" id="note" hidden></aside><div class="control-row"><div class="tools"><button data-action="note" id="noteToggle" aria-expanded="false">교사 메모</button><button data-action="resetPhase">현재 PHASE 초기화</button><button data-action="restart">전체 수업 다시 시작</button></div><div class="navigation"><button id="prev" data-action="prev">◀ 이전</button><button id="reveal" class="primary" data-action="reveal">시작 →</button><button id="next" data-action="next">다음 ▶</button></div></div></footer>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="storageWarning" class="storage-warning" role="status" hidden>임시 저장을 사용할 수 없습니다. 이 창을 닫거나 새로고침하지 마세요.</div>
<dialog id="resetDialog" aria-labelledby="resetTitle"><h2 id="resetTitle">전체 수업을 다시 시작할까요?</h2><p>집계한 숫자와 공개 상태, 진행 시간이 모두 초기화됩니다.</p><div class="row"><button data-action="cancelReset" autofocus>취소</button><button class="primary" data-action="confirmReset">다시 시작</button></div></dialog>
<script>
'use strict';
// ============================================================
// 1. 수업 콘텐츠 수정 영역
// ============================================================
// 여기만 수정하면 됩니다. 후보는 3명으로 유지해 주세요.
const candidates = [
 {name:'기호 1번',title:'학급 보드게임 카페 개설',budget:'30만 원',detail:'남은 예산 사용할 곳 미정'},
 {name:'기호 2번',title:'월1회 단합대회',budget:'50만 원',detail:'담임선생님은 아직 모르고 있음'},
 {name:'기호 3번',title:'매주 금요일 간식',budget:'80만 원',detail:'부족한 예산은 사비로 충당'}
];
// 여기만 수정하면 됩니다. 실제 학교 예산이 아닌 수업용 가상 상황입니다.
const scenario = {
 budget:'50만 원',
 context:'우리 반이 함께 쓸 학급자치 활동비가 생겼습니다.',
 role:'친구들의 의견을 모아 선생님과 협의할 학급 대표를 뽑습니다.'
};

 case 4:if(s.mode==='quiz'){const q=quizQuestions[s.quiz],open=s.answers[s.quiz];return `<div class="row spread"><span class="eyebrow">미니 퀴즈</span><span class="badge">${s.quiz+1} / ${quizQuestions.length}</span></div><div class="quiz-box"><p class="question big">“${esc(q.question)}”</p><p>어떤 선거 원칙에 어긋날까요?</p><div class="quiz-options">${principles.map((p,i)=>`<div class="quiz-option${open&&q.answer===i?' correct':''}">${i+1}. ${esc(p.name)}${open&&q.answer===i?' ✓':''}</div>`).join('')}</div>${open?`<div class="concept result-in"><b>정답 · ${esc(principles[q.answer].name)}</b><br>${esc(q.explanation)}</div>`:'<div class="strip subtle">먼저 생각을 말해 주세요.</div>'}</div><div class="row"><button data-action="cards">4원칙 다시 보기</button><button data-action="quizPrev" ${s.quiz===0?'disabled':''}>이전 문제</button><button data-action="quizNext" ${!open||s.quiz===quizQuestions.length-1?'disabled':''}>다음 문제 →</button></div>`;}return `<p class="question">불공정한 규칙을 어떻게 바꿀 수 있을까요?</p><div class="grid four" style="flex:1">${principles.map((p,i)=>i<s.cards?`<article class="card principle result-in"><span class="eyebrow">원칙 ${pad(i+1)}</span><p class="origin">${esc(p.origin)} ↓</p><h2>${esc(p.name)}</h2><p>${esc(p.description)}</p></article>`:lockedCard(i,'원칙을 생각해 보세요')).join('')}</div>`;
 case 5:return `<div class="row spread"><p class="question">제2회 우리 반 대표 선거</p><span class="badge">종이 모의투표</span></div><div class="polling"><h2>${s.closed?'투표가 종료되었습니다':'투표 진행 중'}</h2>${s.closed?'<p>투표함을 열고 함께 개표해 봅시다.</p>':''}<span>자신이 선택한 한 후보를 투표지에 표시하세요.</span></div><div class="grid four principle-tags">${['모두 한 표','모든 표는 같은 가치','자신이 직접 투표','누구를 뽑았는지는 비밀'].map((t,i)=>`<div class="card">✓ ${t}<div class="small subtle">${principles[i].name}</div></div>`).join('')}</div>`;
 case 6:if(s.question){const q=s.question-1;return `<div class="strip result-banner">${esc(resultText())}</div><div class="reflection"><span class="eyebrow">질문 ${pad(s.question)}</span><p class="question big">${q===0?(winnerIndices().length===1?'이 후보가 우리 반을 대표할 수 있는 이유는 무엇일까?':'공정하게 선출된 대표가 우리 반을 대표할 수 있는 이유는 무엇일까?'):'대표자가 당선된 뒤 공약을 지키지 않는다면?'}</p>${s.concepts[q]?`<div class="concept result-in"><strong>${q===0?'정당성':'대표자 통제·교체'}</strong>${q===0?'정해진 절차를 거쳐 구성원들의 선택을 받았기 때문이다.':'다음 선거에서 다른 후보를 선택할 수 있다.'}</div>`:'<div class="strip subtle">대표를 뽑은 과정을 떠올려 보세요.</div>'}</div><div><button data-action="backTally">개표판 돌아가기</button></div>`;}return `<div class="row spread"><p class="question">${s.done?esc(resultText()):'한 표씩, 함께 확인합니다.'}</p><span class="badge">집계 합계 ${s.counts.reduce((a,b)=>a+b,0)+s.invalid}표</span></div><div class="grid three">${candidates.map((c,i)=>`<article class="card tally-card${s.done&&winnerIndices().includes(i)?' winner':''}"><span class="badge">${esc(c.name)}</span><h2>${esc(c.title)}</h2><span class="number">${s.counts[i]}<small style="font-size:24px"> 표</small></span><div class="track"><div class="bar" style="width:${tallyWidth(i)}%"></div></div><div class="counts"><button data-action="count" data-index="${i}" data-delta="-1" aria-label="${esc(c.name)} 1표 빼기">−1</button><span class="small">${s.done&&winnerIndices().includes(i)?(winnerIndices().length===1?'✓ 최다 득표':'= 공동 최다'):''}</span><button data-action="count" data-index="${i}" data-delta="1" aria-label="${esc(c.name)} 1표 더하기">+1</button></div></article>`).join('')}</div><div class="row spread"><div class="counts"><span>무효표 ${s.invalid}표</span><button data-action="invalid" data-delta="-1" aria-label="무효표 1표 빼기">−1</button><button data-action="invalid" data-delta="1" aria-label="무효표 1표 더하기">+1</button></div></div>`;
 case 7:return previewView(s);
 }}
function previewView(s){
 const back=s.step>0&&!s.ended?'<div><button data-action="previewBack">◀ 앞 질문으로</button></div>':'';
 if(s.step===0)return `<div class="preview-bridge"><span class="eyebrow">오늘의 모의선거 → 실제 선거의 참여</span><div class="strip"><span class="badge">오늘 해 본 일</span><p class="preview-today">${esc(nextLesson.today)}</p></div><p class="question big">${esc(nextLesson.bridge)}</p><div class="strip">공약을 제안하거나 투표 참여를 권하는 것도<br><strong>선거에 참여하는 활동일까요?</strong></div></div>`;
 if(s.step===1)return `<p class="question">다음 시간, 두 주체의 활동을 탐구합니다.</p><div class="grid two preview-actors textbook-actors"><article class="card"><span class="eyebrow">교과서 185쪽</span><h2>유권자</h2><ul>${nextLesson.voterQuestions.map(q=>`<li>${esc(q)}</li>`).join('')}</ul></article><article class="card selected"><span class="eyebrow">교과서 186쪽</span><h2>정당</h2><ul>${nextLesson.partyQuestions.map(q=>`<li>${esc(q)}</li>`).join('')}</ul></article></div>${back}`;
 return `<div class="preview-topic"><span class="eyebrow">${s.ended?'오늘 수업 끝 · 다음 시간에 만나요':'다음 차시 · 교과서 185~186쪽'}</span><h2>${esc(nextLesson.topic)}</h2><div class="preview-scope"><span><b>유권자</b>비교 · 선택 · 참여</span><span><b>정당</b>후보 추천 · 공약 제시 · 홍보</span></div></div><div class="strip question">${s.ended?'다음 시간, 선거에 참여하는 활동을 더 넓게 살펴봅시다.':esc(nextLesson.invitation)}</div>${s.ended?'<div><button data-action="previewAgain">예고 다시 보기</button></div>':back}`;
}
function revealConfig(){const s=current();switch(state.phase){case 0:return ['시작 →',false];case 1:case 2:return [s.revealed?'결과 공개됨':'결과 공개',s.revealed];case 3:return [s.rules<4?`규칙 ${s.rules+1} 공개`:s.revealed?'문제 카드를 눌러 주세요':'결과 공개',s.revealed];case 4:return [s.mode==='cards'?(s.cards<4?`원칙 ${s.cards+1} 공개`:'미니 퀴즈 시작'):(s.answers[s.quiz]?'정답 공개됨':'정답 공개'),s.mode==='quiz'&&s.answers[s.quiz]];case 5:return [s.closed?'개표하러 가기':'투표 종료',false];case 6:return [!s.done?'개표 완료':s.question===0?'질문 1 공개':!s.concepts[s.question-1]?'개념 공개':s.question===1?'질문 2 공개':'개념 공개됨',s.question===2&&s.concepts[1]];case 7:return [s.ended?'수업 종료됨':s.step===0?'탐구 질문 공개':s.step===1?'다음 차시 공개':'수업 종료',s.ended];}}
function render(){
 const oldFocus=document.activeElement;const focusKey=oldFocus?.dataset?.action?{action:oldFocus.dataset.action,index:oldFocus.dataset.index,delta:oldFocus.dataset.delta}:null;
 $('main').innerHTML=`<div class="heading"><div><div class="phase-code">PHASE ${pad(state.phase)} / 07</div><h1>${phaseTitles[state.phase]}</h1></div><div class="time-budget">권장 ${phaseMinutes[state.phase]}</div></div><section class="content">${phaseView()}</section>`;
 $('progress').innerHTML=phaseTitles.map((t,i)=>`<div class="step ${i<state.phase?'past':i===state.phase?'current':''}" title="PHASE ${i} ${esc(t)}" ${i===state.phase?'aria-current="step"':''}></div>`).join('');
 $('main').dataset.phase=state.phase;$('main').dataset.revealed=!!current().revealed;$('main').dataset.done=!!current().done;
 const [label,disabled]=revealConfig();$('reveal').textContent=label;$('reveal').disabled=disabled;$('prev').disabled=state.phase===0;$('next').disabled=state.phase===7;
 $('timers').hidden=!state.timerVisible;$('timerToggle').textContent=state.timerVisible?'타이머 숨기기':'타이머 표시';
 $('note').hidden=!noteOpen;$('noteToggle').setAttribute('aria-expanded',noteOpen);$('note').innerHTML=noteOpen?`<strong>교사 메모 · PHASE ${state.phase}</strong><p>${esc(teacherQuestions[state.phase])}</p><p class="small">단축키: ← → 단계 이동 · Space 공개 · F 전체 화면</p>`:'';
 updateTimers();
 if(focusKey&&oldFocus!==document.activeElement){const target=[...document.querySelectorAll('[data-action]')].find(b=>b.dataset.action===focusKey.action&&b.dataset.index===focusKey.index&&b.dataset.delta===focusKey.delta);target?.focus({preventScroll:true});}
}

// ============================================================
// 4. 교사 조작 함수
// ============================================================
function notify(message,quiet=false){$('toast').classList.toggle('sr-only',quiet);clearTimeout(toastTimeout);$('toast').textContent=message;$('toast').hidden=false;toastTimeout=setTimeout(()=>$('toast').hidden=true,1300);}
function goPhase(p){if(p<0||p>7)return;tick();state.phase=p;noteOpen=false;save();render();}
function reveal(){const s=current();switch(state.phase){
 case 0:goPhase(1);return;
 case 1:case 2:s.revealed=true;break;
 case 3:if(s.rules<4)s.rules++;else s.revealed=true;break;
 case 4:if(s.mode==='cards'){if(s.cards<4)s.cards++;else s.mode='quiz';}else s.answers[s.quiz]=true;break;
 case 5:if(s.closed){goPhase(6);return;}s.closed=true;break;
 case 6:if(!s.done){if(!s.counts.some(v=>v>0)){notify('후보에게 투표한 유효표가 없습니다. 집계를 확인하세요.');return;}s.done=true;}else if(s.question===0)s.question=1;else if(!s.concepts[s.question-1])s.concepts[s.question-1]=true;else if(s.question===1)s.question=2;break;
 case 7:if(s.ended)return;if(s.step<2)s.step++;else {tick();s.ended=true;}break;
 }save();render();
}
function resetPhase(){tick();state.phases[state.phase]=freshPhase(state.phase);state.phaseElapsed[state.phase]=0;noteOpen=false;save();render();notify('현재 PHASE를 초기화했습니다.');}
function restart(){try{localStorage.removeItem(STORAGE_KEY);}catch{}state=freshState();lastTick=Date.now();noteOpen=false;$('resetDialog').close();save();render();$('reveal').focus();notify('새 수업을 시작합니다.');}
function action(name,el){const s=current(),i=Number(el?.dataset.index),delta=Number(el?.dataset.delta);switch(name){
 case 'prev':goPhase(state.phase-1);return;case 'next':goPhase(state.phase+1);return;case 'reveal':reveal();return;
 case 'count':changeCount(i,delta);return;case 'invalid':s.invalid=Math.max(0,s.invalid+delta);invalidateTally();break;
 case 'criterion':s.criteria[i]=!s.criteria[i];break;case 'problem':if(!s.revealed)return;s.problems[i]=!s.problems[i];break;
 case 'cards':s.mode='cards';break;case 'quizNext':if(s.answers[s.quiz]&&s.quiz<quizQuestions.length-1)s.quiz++;break;case 'quizPrev':s.quiz=Math.max(0,s.quiz-1);break;
 case 'previewBack':s.step=Math.max(0,s.step-1);break;case 'previewAgain':s.ended=false;s.step=0;lastTick=Date.now();break;
 case 'backTally':s.question=0;break;case 'timer':state.timerVisible=!state.timerVisible;break;case 'note':noteOpen=!noteOpen;break;
 case 'resetPhase':resetPhase();return;case 'restart':$('resetDialog').showModal();return;case 'cancelReset':$('resetDialog').close();return;case 'confirmReset':restart();return;case 'fullscreen':toggleFullscreen();return;
 default:return;
 }save();render();
}

// ============================================================
// 5. 개표 기능 — 음수 방지, 수정 후 결과 무효화, 동점 처리
// ============================================================
function invalidateTally(){if(state.phase===6){const s=current();s.done=false;s.question=0;s.concepts=[false,false];}}
function changeCount(i,delta){const s=current();if(!s.counts||!Number.isInteger(i)||i<0||i>=s.counts.length||![-1,1].includes(delta))return;const previous=s.counts[i];s.counts[i]=Math.max(0,previous+delta);if(previous===s.counts[i]){notify('0보다 작게 입력할 수 없습니다.');return;}invalidateTally();save();render();if(state.phase!==6&&!s.revealed)notify(delta>0?'1명 추가했습니다.':'1명 뺐습니다.',true);}
function winnerIndices(){const counts=state.phases[6].counts,max=Math.max(...counts);return max===0?[]:counts.map((v,i)=>v===max?i:-1).filter(i=>i>=0);}
function tallyWidth(i){const counts=state.phases[6].counts,total=counts.reduce((a,b)=>a+b,0);return total?counts[i]/total*100:0;}
function resultText(){const winners=winnerIndices(),s=state.phases[6];if(!winners.length)return '아직 유효표가 없습니다.';if(winners.length>1)return `동점입니다. ${winners.map(i=>candidates[i].name).join(' · ')} 각 ${s.counts[winners[0]]}표 — 당선자를 결정하지 않습니다.`;return `${candidates[winners[0]].name} · ${s.counts[winners[0]]}표 — 우리 반의 선택을 받았습니다.`;}

// ============================================================
// 6. localStorage — 새로고침 복구 / 저장 불가 시에도 수업 계속
// ============================================================
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));storageAvailable=true;}catch{storageAvailable=false;}$('storageWarning').hidden=storageAvailable;}
function restore(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return;const value=JSON.parse(raw);if(value.version!==1||!Number.isInteger(value.phase)||value.phase<0||value.phase>7||!Array.isArray(value.phases)||value.phases.length!==8)throw Error('invalid state');const clean=freshState();clean.phase=value.phase;clean.timerVisible=value.timerVisible!==false;const validNumber=n=>Number.isFinite(n)&&n>=0&&n<=Number.MAX_SAFE_INTEGER;for(let p=0;p<8;p++){const target=clean.phases[p],source=value.phases[p];if(!source||typeof source!=='object')throw Error('invalid phase');for(const key of Object.keys(target)){const base=target[key],v=source[key];if(Array.isArray(base)){if(!Array.isArray(v)||v.length!==base.length)continue;target[key]=v.map((item,i)=>typeof base[i]==='boolean'?item===true:validNumber(item)?Math.floor(item):0);}else if(typeof base==='boolean')target[key]=v===true;else if(typeof base==='number')target[key]=validNumber(v)?Math.floor(v):base;else if(typeof v==='string')target[key]=v;}clean.phaseElapsed[p]=validNumber(value.phaseElapsed?.[p])?value.phaseElapsed[p]:0;}
 // 이전 버전의 PHASE 07만 새 예고 화면으로 전환하고, 다른 단계의 집계는 보존합니다.
 if(value.phases[7].previewRevision!==2)clean.phases[7]=freshPhase(7);
 clean.phases[7].step=Math.min(2,clean.phases[7].step);
 if(clean.phases[7].ended)clean.phases[7].step=2;
 clean.phases[3].rules=Math.min(4,clean.phases[3].rules);if(clean.phases[3].rules<4)clean.phases[3].revealed=false;clean.phases[4].cards=Math.min(4,clean.phases[4].cards);clean.phases[4].quiz=Math.min(quizQuestions.length-1,clean.phases[4].quiz);if(!['cards','quiz'].includes(clean.phases[4].mode))clean.phases[4].mode='cards';clean.phases[6].question=Math.min(2,clean.phases[6].question);if(!clean.phases[6].counts.some(n=>n>0)){clean.phases[6].done=false;clean.phases[6].question=0;}if(!clean.phases[6].done)clean.phases[6].question=0;clean.totalElapsed=validNumber(value.totalElapsed)?value.totalElapsed:0;state=clean;
 }catch{state=freshState();notify('저장된 진행 상태를 읽지 못해 새 수업으로 열었습니다.');}}

// ============================================================
// 7. 전체 화면 및 단축키
// ============================================================
async function toggleFullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else notify('브라우저의 F11 키로 전체 화면을 사용하세요.');}catch{notify('브라우저의 F11 키로 전체 화면을 사용하세요.');}}
document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'전체 화면 해제 ↙':'전체 화면 ↗';});
document.addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(button&&!button.disabled)action(button.dataset.action,button);});
document.addEventListener('keydown',event=>{if(event.repeat||event.ctrlKey||event.metaKey||event.altKey||$('resetDialog').open)return;const target=event.target;if(target.closest('input,textarea,select,[contenteditable="true"]'))return;if(event.key==='ArrowRight'){event.preventDefault();goPhase(state.phase+1);}else if(event.key==='ArrowLeft'){event.preventDefault();goPhase(state.phase-1);}else if(event.code==='Space'){event.preventDefault();if(!$('reveal').disabled)reveal();}else if(event.key.toLowerCase()==='f'){event.preventDefault();toggleFullscreen();}});

// ============================================================
// 8. 초기 실행
// ============================================================
restore();render();save();setInterval(()=>{tick();save();},1000);
window.addEventListener('pagehide',()=>{tick();save();});
document.addEventListener('visibilitychange',()=>{tick();save();});
</script>
</body>
</html>
